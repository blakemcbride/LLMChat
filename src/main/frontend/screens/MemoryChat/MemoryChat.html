<div style="max-width: 680px; margin: 24px auto; padding: 0 16px;">

    <h3 style="margin-top: 0;">Memory Chat
        <text-label id="ownsona-badge" style="font-size: 13px; font-weight: normal; margin-left: 12px;"></text-label>
        <push-button id="connect-ownsona" style="margin-left: 10px;">Connect OwnSona</push-button>
    </h3>

    <div style="margin-bottom: 10px;">
        Model:
        <drop-down id="model" style="width: 240px;" required></drop-down>
        <push-button id="new-chat" style="margin-left: 20px;">New Chat</push-button>
    </div>

    <text-label id="transcript"
         style="display: block; height: 380px; width: 640px; overflow-y: auto; border: 1px solid #ccc; border-radius: 6px; padding: 10px; background: #fafafa;">
    </text-label>

    <div style="margin-top: 10px;">
        <textbox-input id="user-msg" style="height: 70px; width: 530px; vertical-align: top;"
                       placeholder="Type a message… (try: remember that …)"></textbox-input>
        <push-button id="send" style="vertical-align: top; height: 70px; width: 90px;">Send</push-button>
    </div>

    <div style="width: 640px; margin-top: 16px; font-size: 12px; color: #666;">
        Answers are grounded in your OwnSona personal memory and generated by your local Ollama
        server. Facts you ask it to remember are written back to OwnSona.
    </div>

</div>
